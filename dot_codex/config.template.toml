# Merged into ~/.codex/config.toml by scripts/codex-update-config.sh.
# Keys here override the existing config, except `notify` (default only).
# App-managed state (projects, plugins, marketplaces, hooks.state, desktop,
# tui, bundled MCP servers) is written by Codex itself and is not tracked.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
hide_agent_reasoning = true
model = "gpt-6-astra"
model_reasoning_effort = "medium"
personality = "pragmatic"
service_tier = "default"
web_search = "live"

# Notification command after responses (single hook only).
# Codex Computer Use wraps this with its own client, so it is default only.
notify = ["bash", "-lc", "afplay /System/Library/Sounds/Ping.aiff"]

[features]
js_repl = false

[sandbox_workspace_write]
network_access = true

# MCP servers
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
